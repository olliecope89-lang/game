name: Build Floppy Fighters PKG

# Builds the PS3 toolchain + PSL1GHT, then compiles the game and packages it.
# First run takes roughly an hour; the toolchain is cached, so later runs are quick.
# Start it from the Actions tab ("Run workflow") or by pushing to the repo.
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev
      NO_SAVANNAH: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf automake bison flex gcc libelf-dev make texinfo \
            libncurses5-dev patch python3 python-is-python3 python3-dev python3-setuptools \
            subversion wget zlib1g-dev libtool-bin bzip2 libgmp3-dev pkg-config g++ libssl-dev

      - name: Find current ps3toolchain version
        id: tc
        run: echo "sha=$(git ls-remote https://github.com/ps3dev/ps3toolchain HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cached toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: ps3dev
          key: ps3dev-toolchain-${{ steps.tc.outputs.sha }}

      - name: Build PS3 toolchain and PSL1GHT (first run only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          git clone --depth 1 https://github.com/ps3dev/ps3toolchain "$RUNNER_TEMP/ps3toolchain"
          cd "$RUNNER_TEMP/ps3toolchain"
          mkdir -p build
          (cd build && ../download.sh)
          # 001/002 PPU binutils+gcc+newlib, 004 ppu-* symlinks, 005/006 SPU binutils+gcc+newlib, 008 PSL1GHT SDK
          for step in 001 002 004 005 006 008; do ./toolchain.sh $step; done

      - name: Build floppy-fighters.pkg
        run: |
          export PATH="$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin"
          make pkg
          ls -la *.pkg *.self

      - uses: actions/upload-artifact@v4
        with:
          name: floppy-fighters-pkg
          path: |
            floppy-fighters.pkg
            floppy-fighters.gnpdrm.pkg
            floppy-fighters.self
